name: Practice image

# Builds the all-in-one image and publishes it on a version tag. Pull requests
# build and smoke-test only, so a broken Dockerfile is caught before release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "practice-image/**"
      - "conf/**"
      - "datasets/**"
      - "notebooks/**"
      - "scripts/**"
  workflow_dispatch:

env:
  IMAGE: bilearner/postgres1000-practice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:pr" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: practice-image/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The smoke test proves the three things that have actually gone wrong
      # before: the data was not baked in, the collation was not C, and
      # JupyterLab did not start.
      - name: Smoke test
        if: github.event_name != 'push'
        run: |
          docker build -f practice-image/Dockerfile -t test-image .
          docker run -d --name t -p 8888:8888 -p 5432:5432 test-image
          for i in $(seq 1 90); do
            docker exec t pg_isready -U book -d pg1000 -q && break || sleep 2
          done

          ORDERS=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT count(*) FROM ecommerce.order_items")
          [ "$ORDERS" = "14998" ] || { echo "::error::order_items=$ORDERS, expected 14998"; exit 1; }

          STAFF=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT count(*) FROM hr.employees")
          [ "$STAFF" = "1200" ] || { echo "::error::hr.employees=$STAFF, expected 1200"; exit 1; }

          COLL=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT datcollate FROM pg_database WHERE datname='pg1000'")
          [ "$COLL" = "C" ] || { echo "::error::collation=$COLL, expected C"; exit 1; }

          EXT=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT count(*) FROM pg_extension")
          [ "$EXT" -ge 8 ] || { echo "::error::only $EXT extensions installed"; exit 1; }

          for i in $(seq 1 45); do
            curl -sf http://localhost:8888/api >/dev/null && break || sleep 2
          done
          curl -sf http://localhost:8888/api >/dev/null || \
            { echo "::error::JupyterLab did not come up"; exit 1; }

          docker exec t test -f /practice/START-HERE.md
          echo "smoke test passed: $ORDERS order lines, $STAFF employees, collation $COLL, $EXT extensions"

      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./practice-image/DOCKERHUB.md
