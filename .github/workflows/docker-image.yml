name: Practice image

# Builds the all-in-one image and publishes it on a version tag. Pull requests
# build and smoke-test only, so a broken Dockerfile is caught before release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "practice-image/**"
      - "conf/**"
      - "datasets/**"
      - "notebooks/**"
      - "scripts/**"
  workflow_dispatch:

env:
  IMAGE: bilearner/postgres1000-practice
  # The same image is published to GitHub's registry as well. It costs
  # nothing, needs no secret -- GITHUB_TOKEN covers it -- and public images
  # there have no pull rate limit, which Docker Hub's anonymous 100-pulls-per
  # -6-hours does. That limit is counted per IP, so it only bites readers
  # behind a shared corporate address, but when the fix is one extra tag
  # there is no reason to leave them without a second source.
  GHCR: ghcr.io/bitoollearner/postgres1000-practice

permissions:
  contents: read
  packages: write        # required to push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest,${GHCR}:${VERSION},${GHCR}:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:pr" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: practice-image/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The smoke test proves the three things that have actually gone wrong
      # before: the data was not baked in, the collation was not C, and
      # JupyterLab did not start.
      - name: Smoke test
        if: github.event_name != 'push'
        run: |
          docker build -f practice-image/Dockerfile -t test-image .
          docker run -d --name t -p 8888:8888 -p 5432:5432 test-image
          for i in $(seq 1 90); do
            docker exec t pg_isready -U book -d pg1000 -q && break || sleep 2
          done

          ORDERS=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT count(*) FROM ecommerce.order_items")
          [ "$ORDERS" = "14998" ] || { echo "::error::order_items=$ORDERS, expected 14998"; exit 1; }

          STAFF=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT count(*) FROM hr.employees")
          [ "$STAFF" = "1200" ] || { echo "::error::hr.employees=$STAFF, expected 1200"; exit 1; }

          COLL=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT datcollate FROM pg_database WHERE datname='pg1000'")
          [ "$COLL" = "C" ] || { echo "::error::collation=$COLL, expected C"; exit 1; }

          EXT=$(docker exec t psql -U book -d pg1000 -tAX -c \
            "SELECT count(*) FROM pg_extension")
          [ "$EXT" -ge 8 ] || { echo "::error::only $EXT extensions installed"; exit 1; }

          # Connect over TCP from OUTSIDE the container, which is what every
          # pgAdmin / DBeaver / DataGrip reader does. This is not the same
          # path as `docker exec psql`, which uses the Unix socket -- an
          # image whose pg_hba.conf lacks a rule for the Docker bridge passes
          # every in-container check and refuses every real client.
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=book psql -h 127.0.0.1 -p 5432 -U book -d pg1000 -tAXc \
            "SELECT 'external connection ok'" || \
            { echo "::error::cannot connect from outside the container"; exit 1; }
          PGPASSWORD=wrong psql -h 127.0.0.1 -p 5432 -U book -d pg1000 -tAXc \
            "SELECT 1" 2>/dev/null && \
            { echo "::error::the exposed port accepts a wrong password"; exit 1; }
          echo "external TCP works and requires the password"

          for i in $(seq 1 45); do
            curl -sf http://localhost:8888/api >/dev/null && break || sleep 2
          done
          curl -sf http://localhost:8888/api >/dev/null || \
            { echo "::error::JupyterLab did not come up"; exit 1; }

          docker exec t test -f /practice/START-HERE.md
          echo "smoke test passed: $ORDERS order lines, $STAFF employees, collation $COLL, $EXT extensions"

      - name: Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./practice-image/DOCKERHUB.md
