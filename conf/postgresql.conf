# Pinned for reproducibility, not for speed.
#
# Parallelism and JIT are OFF because they make execution plans vary between
# runs and between machines. A book that prints plans cannot tolerate that.
# The handful of examples that teach parallel query re-enable it locally with
# SET, and say so in the text.

listen_addresses = '*'
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
random_page_cost = 4.0

max_parallel_workers_per_gather = 0
max_parallel_workers = 0
jit = off

track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

datestyle = 'iso, ymd'
timezone = 'UTC'
default_text_search_config = 'pg_catalog.english'

# ANALYZE samples rows, so estimates -- and therefore plan choices near a cost
# boundary -- can vary between runs. A high target samples far more rows and
# makes estimates converge, which is what keeps printed EXPLAIN output stable
# across machines. Costs more ANALYZE time; irrelevant at book dataset sizes.
default_statistics_target = 1000
